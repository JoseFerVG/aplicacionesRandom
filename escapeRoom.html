<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Una ruta para nosotros ✨</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FAF9F6;
      --card-bg: #FFFFFF;
      --text-main: #2C2A29;
      --text-muted: #7E7C79;
      --accent: #B25858;
      --accent-soft: #F9EEEE;
      --border: #ECEAE4;
      --error: #C94A4A;
      --shadow: 0 12px 32px -8px rgba(0, 0, 0, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 420px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 36px 24px;
      box-shadow: var(--shadow);
      text-align: center;
    }

    .progress-bar {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 28px;
    }

    .progress-dot {
      width: 24px;
      height: 4px;
      background-color: var(--border);
      border-radius: 4px;
      transition: all 0.3s ease;
    }

    .progress-dot.active {
      background-color: var(--accent);
      width: 32px;
    }

    .step-tag {
      display: inline-block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 12px;
      background: var(--accent-soft);
      padding: 4px 12px;
      border-radius: 20px;
    }

    h1, h2 {
      font-family: 'Playfair Display', serif;
      font-weight: 500;
      color: var(--text-main);
      margin-bottom: 16px;
      line-height: 1.3;
    }

    .riddle-text {
      font-size: 1rem;
      line-height: 1.6;
      color: var(--text-muted);
      margin-bottom: 28px;
    }

    .clue-box {
      font-size: 0.85rem;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 10px 14px;
      border-radius: 12px;
      margin-top: -16px;
      margin-bottom: 24px;
      display: none;
      animation: fadeIn 0.4s ease;
    }

    .clue-box.visible {
      display: block;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    input[type="text"] {
      width: 100%;
      padding: 16px 20px;
      border: 1px solid var(--border);
      border-radius: 16px;
      font-size: 1rem;
      font-family: inherit;
      color: var(--text-main);
      background: #FAF9F6;
      text-align: center;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
      background: #FFFFFF;
      box-shadow: 0 0 0 3px rgba(178, 88, 88, 0.12);
    }

    button {
      width: 100%;
      padding: 16px;
      background-color: var(--accent);
      color: #FFFFFF;
      border: none;
      border-radius: 16px;
      font-size: 1rem;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(178, 88, 88, 0.25);
      transition: transform 0.1s ease, background 0.2s ease;
    }

    button:active {
      transform: scale(0.98);
      background-color: #9d4848;
    }

    .error-msg {
      font-size: 0.85rem;
      color: var(--error);
      margin-top: 10px;
      min-height: 1.2em;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .error-msg.show {
      opacity: 1;
    }

    .final-screen {
      display: none;
    }

    .final-screen h1 {
      font-size: 1.8rem;
      margin-bottom: 12px;
    }

    .final-screen p {
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .location-highlight {
      background: var(--accent-soft);
      border: 1px dashed var(--accent);
      border-radius: 16px;
      padding: 20px 16px;
      font-size: 1.05rem;
      font-weight: 500;
      color: var(--accent);
      line-height: 1.5;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="card" id="game-card">
      <div class="progress-bar" id="progress-bar"></div>
      <span class="step-tag" id="step-tag">Paso 1 de 4</span>
      <h2 id="stage-title"></h2>
      <p class="riddle-text" id="riddle-text"></p>
      <div class="clue-box" id="clue-box"></div>

      <div class="input-group">
        <input type="text" id="answer-input" placeholder="Escribe tu respuesta..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <button id="submit-btn" onclick="checkAnswer()">Continuar</button>
      </div>
      <div class="error-msg" id="error-msg"></div>
    </div>

    <div class="card final-screen" id="final-card">
      <div style="font-size: 2.2rem; margin-bottom: 12px;">🤍</div>
      <h1>¡Llegaste al final!</h1>
      <p>Has superado cada recuerdo de nuestra ruta. Tu sorpresa te espera ahora mismo:</p>
      
      <div class="location-highlight">
        🖼️ Mira detrás del cuadro de tu primera comunión
      </div>
    </div>
  </div>

  <script>
    const stages = [
      {
        title: "El origen",
        riddle: "No hizo falta firmar ningún tratado, pero allí se negociaron los primeros nervios. Introduce cómo le llamamos al sitio donde empezó todo.",
        clue: "La mesa cojeaba un poco.",
        answers: ["irlandes", "el irlandes"]
      },
      {
        title: "La escapada",
        riddle: "Muchos kilómetros, una lista de reproducción en bucle y la prueba definitiva de convivir fuera de nuestra zona de confort. Introduce la ciudad que conquistamos juntos.",
        clue: null,
        answers: ["toledo"]
      },
      {
        title: "La confesión",
        riddle: "Aquella mítica anécdota donde la sinceridad superó con creces los límites frente a tus padres al decirles que ibas a dormir conmigo...",
        clue: null,
        answers: [
          "no necesito pijama", 
          "no me hace falta pijama", 
          "sin pijama", 
          "dormir sin pijama", 
          "no hace falta pijama"
        ]
      },
      {
        title: "El rincón clave",
        riddle: "Ese punto icónico frente al monumento más imponente de la ciudad y su plaza. ¿Cuál es ese lugar?",
        clue: null,
        answers: [
          "catedral", 
          "la catedral", 
          "plaza de la catedral", 
          "plaza cardenal belluga", 
          "plaza belluga", 
          "belluga"
        ]
      }
    ];

    let currentStage = 0;
    let failedAttempts = 0;

    function normalize(str) {
      return str
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, "")
        .trim();
    }

    function initProgress() {
      const bar = document.getElementById("progress-bar");
      bar.innerHTML = "";
      stages.forEach((_, i) => {
        const dot = document.createElement("div");
        dot.className = `progress-dot ${i === 0 ? 'active' : ''}`;
        dot.id = `dot-${i}`;
        bar.appendChild(dot);
      });
    }

    function renderStage() {
      const stage = stages[currentStage];
      document.getElementById("step-tag").innerText = `Paso ${currentStage + 1} de ${stages.length}`;
      document.getElementById("stage-title").innerText = stage.title;
      document.getElementById("riddle-text").innerText = stage.riddle;
      
      const clueBox = document.getElementById("clue-box");
      clueBox.classList.remove("visible");
      clueBox.innerText = "";
      
      const input = document.getElementById("answer-input");
      input.value = "";
      input.focus();
      
      document.getElementById("error-msg").classList.remove("show");
      failedAttempts = 0;

      stages.forEach((_, i) => {
        const dot = document.getElementById(`dot-${i}`);
        if (dot) {
          dot.className = `progress-dot ${i <= currentStage ? 'active' : ''}`;
        }
      });
    }

    function checkAnswer() {
      const input = document.getElementById("answer-input");
      const errorMsg = document.getElementById("error-msg");
      const userText = normalize(input.value);
      const stage = stages[currentStage];

      if (!userText) {
        errorMsg.innerText = "Escribe una respuesta para continuar.";
        errorMsg.classList.add("show");
        return;
      }

      const isCorrect = stage.answers.some(ans => {
        const normAns = normalize(ans);
        return userText === normAns || userText.includes(normAns);
      });

      if (isCorrect) {
        currentStage++;
        if (currentStage >= stages.length) {
          document.getElementById("game-card").style.display = "none";
          document.getElementById("final-card").style.display = "block";
        } else {
          renderStage();
        }
      } else {
        failedAttempts++;
        errorMsg.innerText = "Respuesta incorrecta, piénsalo bien...";
        errorMsg.classList.add("show");

        if (stage.clue && failedAttempts >= 2) {
          const clueBox = document.getElementById("clue-box");
          clueBox.innerText = `Pista: ${stage.clue}`;
          clueBox.classList.add("visible");
        }
      }
    }

    document.getElementById("answer-input").addEventListener("keypress", function(e) {
      if (e.key === "Enter") {
        checkAnswer();
      }
    });

    initProgress();
    renderStage();
  </script>
</body>
</html>
